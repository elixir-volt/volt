name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elixir:
    uses: elixir-vibe/actions/.github/workflows/elixir-ci.yml@v1
    with:
      latest-elixir: "1.20"
      latest-otp: "29"
      min-elixir: "1.18"
      min-otp: "27"
      deps-command: |
        sudo apt-get update
        sudo apt-get install --yes inotify-tools
        mix deps.get
        npm ci
        npx playwright install --with-deps chromium
      latest-command: MIX_ENV=dev mix lint && MIX_ENV=test mix test
      min-command: mix compile --warnings-as-errors && mix test
